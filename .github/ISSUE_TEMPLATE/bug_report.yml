name: Bug or Camera Compatibility Report
description: Report an issue or submit UVC descriptor details for your USB webcam
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: Describe what you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "e.g. macOS 15.4 / macOS 27.0.1"
    validations:
      required: true
  - type: input
    id: camera
    attributes:
      label: USB Webcam model
      placeholder: "e.g. Logitech StreamCam / Elgato Facecam / Creative Live! Cam Sync V3"
    validations:
      required: true
  - type: textarea
    id: describe
    attributes:
      label: "`webcamctl` Hardware Descriptor Output"
      description: Paste the output of `webcamctl list` and `webcamctl describe`.
      render: text
  - type: textarea
    id: log
    attributes:
      label: Diagnostics Log
      description: Relevant lines from `~/Library/Logs/WebCamController.log`, if any.
      render: text
